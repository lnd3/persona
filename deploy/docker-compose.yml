# Production compose stack for persona's own public landing page
# (solemn.network) — copied and adapted directly from EphemNet's own
# deploy/docker-compose.yml (same server, `bh2`, same convention —
# itself copied from cinder's D007/P008). Two services since
# 2026-10-01 (A010): `persona-web` (a real Go binary, `cmd/persona-web`)
# serves site/index.html and reports page views to wisp; `persona-caddy`
# still terminates TLS and reverse-proxies to it, same role it always
# had. Before A010, persona-caddy served the static file directly with
# no persona code in the request path at all — see persona-web's own
# package doc comment for why that changed. Never invoked directly —
# always via deploy/ops.sh or deploy/deploy.sh, which pass
# `-p <environment>` (see deploy/environments.sh) so "live" and "dev"
# never collide on container/volume/network names, and never collide
# with cinder's or EphemNet's own stacks on the same host.
#
# Real, pinned subnet (not Compose's auto-assigned one) — checked live
# against `bh2` itself on 2026-09-30, not just inferred from other
# repos' own docs (an earlier draft of this file picked 172.31.1.0/24,
# which turned out to already be in live use — see below). Confirmed
# in-use ranges at that check: cinder 172.28.0.0/24 (live, six /24s)
# and 172.29.0.0/24 (dev); EphemNet 172.30.1.0/24 (live); a fourth
# product on this same server, `offgridapp` (not previously known to
# this repo's own plan), 172.31.1.0/24 (live).
#
# CORRECTED 2026-10-01 — real bug, not just a style nit: the original
# pick here, 172.32.1.0/24, is NOT RFC 1918 private space.
# 172.16.0.0/12 (RFC 1918's middle private block) covers exactly
# 172.16.0.0-172.31.255.255; 172.32.x.x is real, publicly-routable
# IPv4 space owned by an actual internet organization. A Docker bridge
# subnet outside RFC 1918 doesn't leak traffic directly (still
# NAT/bridge-isolated), but it creates a real route-table collision
# risk: if this host or container ever needed to reach a genuine
# public host inside 172.32.1.0/24, the kernel would wrongly prefer
# the local bridge route over the real internet route. persona now
# takes 172.21.1.0/24 (live) / 172.21.2.0/24 (dev) — confirmed free at
# the same 2026-09-30 check (172.21.0.0/16 through 172.27.0.0/16 were
# entirely unused on `bh2`; only 172.17-172.20 and 172.28-172.31 were
# claimed), and correctly inside 172.16.0.0/12.
#
# Ports checked the same way: cinder's live stack occupies
# 9180-9184/9443-9447 (dev 9280-9284/9543-9547); EphemNet's live stack
# occupies 9190/9450; `offgridapp`'s live stack occupies 9200/9460 —
# this file originally picked those same two ports before the live
# check caught the collision. persona takes the next free pair,
# 9210/9470 (live), 9310/9570 (dev).

services:
  # persona-web (A010, 2026-10-01): the real Go binary that now serves
  # site/index.html and reports page views to wisp
  # (github.com/lnd3/wisp/hook) — see cmd/persona-web/main.go's own
  # package doc comment for why this exists at all. No host-published
  # port: reachable only from persona-caddy, over the shared
  # persona-edge network, by container DNS name. WISP_ENDPOINT/
  # WISP_TOKEN come from deploy/.env; an empty WISP_ENDPOINT makes the
  # hook a no-op (dev/local runs never need a real token).
  persona-web:
    build:
      context: ..
      dockerfile: deploy/persona-web/Dockerfile
    environment:
      - PERSONA_WEB_ADDR=:8080
      - PERSONA_SITE_DIR=/srv/site
      - PERSONA_EDGE_SUBNET=${PERSONA_EDGE_SUBNET:-172.21.1.0/24}
      - WISP_ENDPOINT=${WISP_ENDPOINT:-}
      - WISP_TOKEN=${WISP_TOKEN:-}
    volumes:
      - ../site:/srv/site:ro
    networks:
      - persona-edge
    restart: unless-stopped

  # persona's own landing page (solemn.network) — still the TLS-
  # terminating sidecar (same shape as EphemNet's own ephemnet-caddy),
  # now reverse-proxying to persona-web instead of serving files
  # itself. Add a second hostname/mount here the same way EphemNet did
  # for its agent-download page, if/when persona.solemn.network needs
  # its own distinct content instead of reusing this same page.
  persona-caddy:
    image: caddy:2
    environment:
      - PERSONA_DOMAIN=${PERSONA_DOMAIN:?set PERSONA_DOMAIN in deploy/.env}
      - PERSONA_EDGE_SUBNET=${PERSONA_EDGE_SUBNET:-172.21.1.0/24}
    volumes:
      - ./persona-caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - persona-caddy-data:/data
      - persona-caddy-config:/config
    ports:
      - "127.0.0.1:${PERSONA_CADDY_HTTPS_PORT:-9470}:443"
      # HTTP-01 challenge port — see cinder's own D007 Log for why
      # HTTP-01, not TLS-ALPN-01 (a real, extensively-diagnosed
      # production failure with the latter, never root-caused).
      - "127.0.0.1:${PERSONA_CADDY_HTTP_PORT:-9210}:80"
    networks:
      - persona-edge
    depends_on:
      - persona-web
    restart: unless-stopped

networks:
  # Deliberately just {persona-caddy} — nothing else ever joins it, so
  # nothing else can ever reach it except nginx's own published-port
  # forwarding. Not marked `internal: true`: Caddy needs real outbound
  # internet access for ACME (Let's Encrypt).
  persona-edge:
    ipam:
      config:
        - subnet: ${PERSONA_EDGE_SUBNET:-172.21.1.0/24}

volumes:
  persona-caddy-data:
  persona-caddy-config:
