<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>persona signer</title>
    <style>
      body {
        font: 13px -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .origin {
        color: #555;
        word-break: break-all;
        margin-bottom: 12px;
      }
      .event {
        background: #f4f4f4;
        border-radius: 6px;
        padding: 8px;
        font-family: monospace;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 120px;
        overflow: auto;
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-weight: 600;
      }
      select,
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        font-size: 13px;
      }
      .buttons {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        flex: 1;
        padding: 8px;
        font-size: 13px;
        border-radius: 6px;
        border: 1px solid #ccc;
        cursor: pointer;
      }
      button.approve {
        background: #1a7f37;
        color: white;
        border-color: #1a7f37;
      }
      button.deny {
        background: white;
      }
      .error {
        color: #b00020;
        margin-top: 8px;
      }
      .empty {
        color: #555;
      }
      .build-info {
        margin-top: 10px;
        font-size: 10px;
        color: #999;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script type="module" src="../../dist/approve/approve.js"></script>
  </body>
</html>
